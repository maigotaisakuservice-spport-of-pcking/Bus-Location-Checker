<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バス運行状況確認システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6 font-sans">
    <div class="max-w-md w-full glass-card p-10 rounded-[3rem] shadow-2xl border border-white text-center">
        <div class="mb-10">
            <div class="w-24 h-24 bg-blue-500 rounded-3xl mx-auto flex items-center justify-center text-5xl shadow-xl shadow-blue-200 mb-6">🚌</div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tight leading-tight">Bus-Location-Checker</h1>
            <p class="text-slate-400 mt-2 font-medium">ポータル画面</p>
        </div>

        <div class="space-y-4">
            <button onclick="goToUser()" class="w-full bg-blue-600 text-white py-6 rounded-2xl font-black text-lg hover:bg-blue-700 transition shadow-lg shadow-blue-100 active:scale-95">
                バス走行状況確認<br><span class="text-sm font-bold opacity-80">(保護者様用)</span>
            </button>

            <button onclick="goToAdmin()" class="w-full bg-white text-slate-600 py-6 rounded-2xl font-black text-lg border border-slate-200 hover:bg-slate-50 transition active:scale-95">
                管理者ページ
            </button>

            <button onclick="location.href='guide.html'" class="w-full bg-slate-50 text-slate-400 py-4 rounded-2xl font-black text-sm border border-slate-100 hover:bg-slate-100 transition active:scale-95 flex items-center justify-center">
                📖 使い方ガイド
            </button>
        </div>

        <p class="mt-10 text-[10px] text-slate-300 font-black uppercase tracking-widest">© 2024 Bus-Location-Checker</p>
    </div>

    <script>
        function goToUser() {
            window.location.href = 'web/user/index.html';
        }

        function goToAdmin() {
            const passcode = prompt("管理者用パスコードを入力してください:");
            if (passcode === null) return;

            const targetHash = "4d3b347af62a9629e575c6acac62aebfc993e254ddc3226a47cd6c8957535783";
            const hashedInput = CryptoJS.SHA256(passcode).toString();

            if (hashedInput === targetHash) {
                window.location.href = 'web/admin/index.html';
            } else {
                alert("パスコードが正しくありません");
            }
        }
    </script>
</body>
</html>

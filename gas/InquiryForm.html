<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 p-6 font-sans">
  <div class="max-w-md mx-auto bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100">
    <div class="flex items-center space-x-3 mb-8">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-xl shadow-lg">🚌</div>
      <h1 class="text-xl font-black tracking-tighter">お問い合わせ</h1>
    </div>

    <form id="inquiryForm" class="space-y-6">
      <input type="hidden" name="uid" value="<?= uid ?>">

      <div>
        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">管理者UID</label>
        <div class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 text-xs font-mono text-slate-400">
          <?= uid ?>
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">お問い合わせ内容</label>
        <textarea name="message" rows="5" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-200 outline-none focus:border-blue-500 transition font-bold" placeholder="ご質問や不具合報告などをご記入ください" required></textarea>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200 hover:bg-blue-700 transition active:scale-95">
        送信する
      </button>
    </form>

    <div id="successMsg" class="hidden text-center py-10 space-y-4">
      <div class="text-4xl">✅</div>
      <p class="font-black text-slate-800">お問い合わせを送信しました。</p>
      <p class="text-sm text-slate-500 font-medium">回答まで今しばらくお待ちください。</p>
    </div>
  </div>

  <script>
    document.getElementById('inquiryForm').onsubmit = function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = '送信中...';

      const formData = {
        uid: this.uid.value,
        message: this.message.value
      };

      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('inquiryForm').classList.add('hidden');
          document.getElementById('successMsg').classList.remove('hidden');
        })
        .withFailureHandler(function(err) {
          alert('送信に失敗しました: ' + err);
          btn.disabled = false;
          btn.innerText = '送信する';
        })
        .processInquiry(formData);
    };
  </script>
</body>
</html>
